name: Studio checks
on:
  pull_request:
  push:
    branches:
      [main, feat/story-studio-v1, feat/elevenlabs-v2, feat/story-studio-v3]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
