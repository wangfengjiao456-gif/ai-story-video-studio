# Deploy this repository as a Render Blueprint. Never use Vercel for FFmpeg processes.
services:
  - type: web
    name: story-studio-renderer
    runtime: docker
    branch: feat/story-studio-v3-1
    plan: standard
    dockerfilePath: ./renderer/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: RENDERER_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: "8000"
